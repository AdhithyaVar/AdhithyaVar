name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *"   # daily; off the hour because top-of-hour runs get delayed
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build card
        env:
          # your own token (secret ACCESS_TOKEN) if you added one, otherwise the built-in one, which sees public data only
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # used if ACCESS_TOKEN is refused (revoked, expired)
          USER_NAME: ${{ github.repository_owner }}
        run: python build_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
